services:

  caddy:
    image: caddy:2.11-alpine
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS}
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - $PWD/caddy:/etc/caddy
      - $PWD/website:/srv
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddy_net

  grafana:
    image: grafana/grafana:main-ubuntu-slim
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - 8030:3000
    networks:
      - caddy_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 60s
        max_attempts: 3
        window: 120s
  
  ntfy:
    image: binwiederhier/ntfy:v2.23
    command: serve
    environment:
      - TZ=Europe/Berlin
    # user: UID:GID # optional: replace with your own user/group or uid/gid
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_config:/etc/ntfy
    ports:
      - 8080:80
    networks:
      - caddy_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 60s
        max_attempts: 3
        window: 120s

volumes:
  caddy_data:
  caddy_config:
  grafana_data:
  ntfy_cache:
  ntfy_config:

networks:
  caddy_net:
    driver: overlay
